# UAT: /etc/nginx/sites-available/secprov  (HTTPS on Nginx with the company certificate)
server {
    listen 80;
    listen [::]:80;
    server_name uatsecprov.indiraivf.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uatsecprov.indiraivf.in;

    ssl_certificate     /etc/nginx/ssl/indiraivf.in/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/indiraivf.in/private.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /path/to/finance-security-provision-tool;
    index index.html;

    # Serve only the built pages at the top level (index.html = start page, security.html, one page per provision).
    # Everything else returns 404: .git, src/, test/, docs/, dist/, SHA256SUMS, sub-folders, other file types.
    location = / { try_files /index.html =404; }
    location ~ ^/[a-z0-9-]+\.html$ { }
    location / { return 404; }

    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    server_tokens off;
}
