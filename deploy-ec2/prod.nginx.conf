# Production: /etc/nginx/sites-available/secprov.indiraivf.in  (HTTPS on the load balancer, Nginx on port 80 only)
server {
    listen 80;
    server_name secprov.indiraivf.in;

    root /path/to/finance-security-provision-tool;
    index index.html;

    # Serve only the tool page; source files and .git return 404
    location = / { try_files /index.html =404; }
    location = /index.html { }
    location / { return 404; }

    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    server_tokens off;
}
